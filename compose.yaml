services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env
    environment:
      PORT: 5000
      FLASK_DEBUG: "0"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - hiremind_data:/app/Database
      - generated_profiles:/app/Profile_generator/Profile_Database
    restart: unless-stopped

  resume-ui:
    build:
      context: .
      dockerfile: deploy/resume-ui.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  hiremind_data:
  generated_profiles:
